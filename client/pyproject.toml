[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aqef-client"
version = "0.1.0"
description = "Thin Python SDK and CLI for the AQEF reference REST API"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28,<0.29", "PyYAML>=6,<7"]

[project.scripts]
aqef = "aqef_client.cli:main"

[tool.setuptools]
packages = ["aqef_client"]
